<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exmplo Pseudo-Classe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Pseudo-Classes</h1>
    <section>
        <h3>Formulário</h3>
        <input type="text" placeholder="Selecione para ver o: focus">
        <button>botão com :hover</button>
    </section>

    <section>
        <p>Esse é o primeiro parágrafo (fisrt-child).</p>
        <p>Esse é o segundo parágrafo (normal).</p>
    </section>

    <section>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </section>

    <section>
        <h3>Tabela com linhas alternadas</h3>
        <table>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
            </tr>

            <tr>
                <th>José</th>
                <th>20</th>
            </tr>

            <tr>
                <th>Grasiele</th>
                <th>22</th>
            </tr>

            <tr>
                <th>Cesar</th>
                <th>19</th>
            </tr>

            <tr>
                <th>Joana</th>
                <th>21</th>
            </tr>
        </table>
    </section>
</body>
</html>
