<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <section>
        <h2>Formulário</h2>
        <form action="cadastro.php" method="post">
            <p><label for="nome">Nome:</label>
                <input type="text" name="nome" placeholder="Digite seu nome" required>
            </p>

            <p><label for="senha">Senha:</label>
                <input type="password" name="senha" placeholder="Digite sua senha" required max_length="8">
            </p>

            <p><label for="telefone">Telefone:</label>
                <input type="text" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="Digite seu telefone"
                    title="Formato: (00) 00000-0000" required>
            </p>

            <p><label for="email">Email:</label>
                <input type="email" name="email" placeholder="Digite seu email" required>
            </p>

            <p><label for="cep">CEP:</label>
                <input type="text" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="Digite seu CEP"
                    title="Formato: 00000-000" required>
            </p>

            <p><label>Sobre você:</label>
                <textarea name="bio" rows="10" cols="100"></textarea>
            </p>

            <p><label for="genero">Gênero:</label>
                <input type="radio" name="genero" value="masculino" required>Masculino
                <input type="radio" name="genero" value="feminino">Feminino
            </p>

            <p><label for="interesses">Interesses:</label>
                <input type="checkbox" name="interesses" value="esportes">Esportes
                <input type="checkbox" name="interesses" value="artes">Artes
                <input type="checkbox" name="interesses" value="tecnologia">Tecnologia
            </p>

            <p><label for="pais">País:</label>
                <select name="pais" required>
                    <option value="">Selecione um país</option>
                    <option value="brasil">Brasil</option>
                    <option value="estados-unidos">Estados Unidos</option>
                    <option value="canada">Canadá</option>
                    <option value="reino-unido">Reino Unido</option>
                </select>
            </p>

            <p><label for="foto">Foto:</label>
                <input type="file" name="foto" >
            </p>

            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </form>
    </section>
</body>

</html>
