<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagramação de Elementos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topo">
    <h1>Diagramação de Elementos</h1>
    <nav>
      <a href="#sobre">Sobre</a>
      <a href="#lista">Lista</a>
      <a href="#tabela">Tabela</a>
    </nav>
  </header>

  <main>
    <img src="assets/fit.webp" alt="Fit Brabo slk">

    <section id="sobre">
      <h2>Aprendendo a estilizar</h2>
      <p class="destaque">Com HTML e CSS, podemos organizar e personalizar o conteúdo de uma página.</p>
    </section>

    <section id="lista">
      <h2>O que vamos praticar</h2>
      <ul>
        <li>Seletores CSS</li>
        <li>Cores e fontes</li>
        <li>Box model</li>
      </ul>
    </section>

    <section id="tabela">
      <h2>Propriedades CSS</h2>
      <table>
        <tr>
          <th>Propriedade</th>
          <th>Uso</th>
          <th>Exemplo</th>
        </tr>
        <tr>
          <td>Padding</td>
          <td>Espaço interno</td>
          <td>10px</td>
        </tr>
      </table>
    </section>
  </main>
</body>
</html>
